services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      NEUROGENE_MODE: preview
      NEUROGENE_ENV: production
      NEUROGENE_ALLOWED_HOSTS: api,localhost,127.0.0.1
    volumes:
      - ${REVIEWED_RESULTS_DIR:-./results/deployment/rc1/public_candidate}:/data:ro
    ports:
      - "127.0.0.1:8010:8000"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 1g
  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:3010:3000"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m", "/app/.next/cache:rw,noexec,nosuid,size=64m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 512m
